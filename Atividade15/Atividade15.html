<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 15</title>
    <link rel="stylesheet" href="Atividade15.css">
</head>
<body>
    <form id="formularioPrincipal" name ="formularioPrincipal">
        <H1>Formulario Principal</H1>
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" required
        minlength="10">
        <br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <br><br>
        <label for="comentario">Comentario:</label>
        <br><br>
        <textarea type="text" id="comentario" name="comentario" cols="30" rows="10"
        minlength="20" required></textarea>
        <br><br>
        <label for="radio">Primeira vez no site?</label>
        <br><br>
        <label for="radio1">Sim</label>
        <input type="radio" id="radio1" name="radio" value="Sim" required>
        <label for="radio2">Não</label>
        <input type="radio" id="radio2" name="radio" value="Não" required>
        <br><br>
        <button type="submit">Enviar</button>
    </form>
        <script src="Atividade15.js"></script>
</body>
</html>
